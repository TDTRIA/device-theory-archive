<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ACCESS DENIED</title>

<style>

body{
    margin:0;
    background:black;
    color:#4d0000;
    font-family:"Wingdings", sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
}

/* SCANLINES */

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    background:repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.015),
        rgba(255,255,255,0.015) 1px,
        transparent 1px,
        transparent 3px
    );
}

/* TEXT */

.denied{
    font-size:72px;
    font-weight:bold;
    letter-spacing:10px;
    animation:flicker 1.5s infinite;
    text-align:center;
    text-shadow:0 0 12px rgba(120,0,0,0.4);
}
.sub{
    margin-top:30px;
    color:#300000;
    font-family:"Courier New", monospace;
    font-size:13px;
    letter-spacing:2px;
}

@keyframes flicker{

    0%{opacity:1;}
    50%{opacity:0.35;}
    100%{opacity:1;}

}

</style>
</head>

<body>

<div class="denied">
BLACK EYES NOT DETECTED
</div>

<div class="sub">
OBSERVER REJECTED
</div>

</body>
</html>
